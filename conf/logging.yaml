version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "[%(levelname)-7s] %(asctime)s [%(process)2d] -[%(filename)s:%(lineno)d] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout
  file_info:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: default
    filename: logs/info.log
    when: midnight
    interval: 1
    backupCount: 7
    encoding: utf8
    delay: true
  file_error:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    formatter: default
    filename: logs/error.log
    when: midnight
    interval: 1
    backupCount: 7
    encoding: utf8
    delay: true

loggers:
  uvicorn:
    level: INFO
    handlers:
      - console
      - file_info
    propagate: false
  uvicorn.error:
    level: INFO
    handlers:
      - console
      - file_error
    propagate: false
  uvicorn.access:
    level: INFO
    handlers:
      - console
      - file_info
    propagate: false

root:
  level: INFO
  handlers:
    - console
    - file_info
    - file_error
